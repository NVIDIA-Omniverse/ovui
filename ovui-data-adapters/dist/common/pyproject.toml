[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovui-data-adapters-common"
license = {text = "Apache-2.0"}
dynamic = ["version"]
description = "Provider-neutral UI data-adapter contracts and shared helpers."
readme = {content-type = "text/markdown", text = """
# ovui-data-adapters-common

Pure-Python adapter contracts and records shared by ovui-widgets and backend
implementations. This distribution defines stage, property, transform,
renderer, selection, command, subscription, undo, camera-pose, and GPU-frame
interfaces without requiring OpenUSD, ovrtx, ovstream, or GPU runtimes. NumPy
supports the shipped provider-neutral livestream frame conversion helper;
ovstream remains a lazy, externally supplied runtime used only when streaming
is enabled.

Use these contracts when connecting ovui-widgets to OpenUSD, mock data, or a
project-specific backend.
"""}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["numpy>=1.20"]

[project.entry-points."ovui.inspector_commands"]
render_diagnostics = "ovui_data_adapters.common.render_diagnostics_service:inspector_commands"

[project.entry-points."ovui.inspector_status"]
render_diagnostics = "ovui_data_adapters.common.render_diagnostics_service:inspector_status"

[tool.setuptools.packages.find]
namespaces = true
include = ["ovui_data_adapters.common*"]
# Source lives two levels up at ``ovui-data-adapters/ovui_data_adapters/common/`` —
# same ``dist/<sub>/pyproject.toml`` + ``where = "../.."`` pattern as
# ``ovui-widgets/dist/``. This pattern supports editable installs
# (``pip install -e``) and wheel builds run in-tree; **sdist builds from
# the ``dist/<sub>/`` stub are NOT supported** because setuptools cannot
# include source two levels above the project root in a self-contained
# release tarball. If sdist publishing of adapters is ever needed,
# restructure to co-located pyprojects
# (``ovui-data-adapters/<sub>/pyproject.toml`` next to source with
# ``where = ["."]``).
where = ["../.."]
