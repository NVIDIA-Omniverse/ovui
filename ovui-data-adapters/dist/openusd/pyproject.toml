[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovui-data-adapters-openusd"
license = {text = "Apache-2.0"}
# Dependencies are in setup.py: first-party packages are pinned to VERSION.md.
dynamic = ["version", "dependencies"]
description = "Concrete OpenUSD data adapters and renderer-side OpenUSD support."
readme = {content-type = "text/markdown", text = """
# ovui-data-adapters-openusd

OpenUSD-backed adapter implementations for ovui-widgets. This distribution
provides USD stage hierarchy, property, transform, layer/composition, renderer,
camera, picking, selection-highlight, session authoring, and undoable command
support behind the common adapter contracts.

It depends on `ovui-data-adapters-common` and `numpy`. The `standalone` extra
supplies `usd-core==25.11`, which publishes wheels for Python 3.12 and 3.13
only (see the Python 3.14 and 3.15 note in the ovui-data-adapters README); Kit and custom-USD environments supply their own
matching `pxr` runtime. Supply ovrtx separately when using renderer-backed
viewport work.
"""}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.optional-dependencies]
standalone = ["usd-core==25.11"]
livestream = ["ovstream"]

[project.entry-points."ovui_data_adapters.adapters"]
openusd = "ovui_data_adapters.openusd.register:register"

[tool.setuptools.packages.find]
namespaces = true
include = ["ovui_data_adapters.openusd*"]
# Source lives two levels up at ``ovui-data-adapters/ovui_data_adapters/openusd/`` —
# same ``dist/<sub>/pyproject.toml`` + ``where = "../.."`` pattern as
# ``ovui-widgets/dist/``. This pattern supports editable installs
# (``pip install -e``) and wheel builds run in-tree; **sdist builds from
# the ``dist/<sub>/`` stub are NOT supported** because setuptools cannot
# include source two levels above the project root in a self-contained
# release tarball. If sdist publishing of adapters is ever needed,
# restructure to co-located pyprojects
# (``ovui-data-adapters/<sub>/pyproject.toml`` next to source with
# ``where = ["."]``).
where = ["../.."]
