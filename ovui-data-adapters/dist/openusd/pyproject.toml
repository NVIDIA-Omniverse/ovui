[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovui-data-adapters-openusd"
dynamic = ["version"]
description = "Concrete OpenUSD data adapters and renderer-side OpenUSD support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ovui-data-adapters-common>=0.1.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
standalone = ["usd-core==25.11"]
livestream = ["ovstream"]

[project.entry-points."ovui_data_adapters.adapters"]
openusd = "ovui_data_adapters.openusd.register:register"

[tool.setuptools.packages.find]
namespaces = true
include = ["ovui_data_adapters.openusd*"]
# Source lives two levels up at ``ovui-data-adapters/ovui_data_adapters/openusd/`` —
# same ``dist/<sub>/pyproject.toml`` + ``where = "../.."`` pattern as
# ``ovui-widgets/dist/``. This pattern supports editable installs
# (``pip install -e``) and wheel builds run in-tree; **sdist builds from
# the ``dist/<sub>/`` stub are NOT supported** because setuptools cannot
# include source two levels above the project root in a self-contained
# release tarball. If sdist publishing of adapters is ever needed,
# restructure to co-located pyprojects
# (``ovui-data-adapters/<sub>/pyproject.toml`` next to source with
# ``where = ["."]``).
where = ["../.."]
