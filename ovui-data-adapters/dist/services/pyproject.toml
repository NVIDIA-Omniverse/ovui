[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovui-data-adapters-services"
license = {text = "Apache-2.0"}
# Dependencies are in setup.py: first-party packages are pinned to VERSION.md.
dynamic = ["version", "dependencies"]
description = "Frontend-neutral behavior services built above ovui data-adapter contracts."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
namespaces = true
include = ["ovui_data_adapters.services*"]
# Source lives two levels up at ``ovui-data-adapters/ovui_data_adapters/services/`` -
# same ``dist/<sub>/pyproject.toml`` + ``where = "../.."`` pattern as
# the existing common/openusd adapter distributions. This pattern
# supports editable installs (``pip install -e``) and wheel builds run
# in-tree; **sdist builds from the ``dist/<sub>/`` stub are NOT
# supported** because setuptools cannot include source two levels above
# the project root in a self-contained release tarball. If sdist
# publishing of adapters is ever needed, restructure to co-located
# pyprojects (``ovui-data-adapters/<sub>/pyproject.toml`` next to
# source with ``where = ["."]``).
where = ["../.."]
