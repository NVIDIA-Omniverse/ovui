[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovwidgets-layers"
dynamic = ["version"]
description = "OvWidgets Layers Panel"
requires-python = ">=3.10"
dependencies = [
    "ovwidgets-common>=0.1.0",
    "ovui-data-adapters-common>=0.1.0",
]

[tool.setuptools.packages.find]
namespaces = true
include = ["ovwidgets.layers*"]
where = ["../.."]
