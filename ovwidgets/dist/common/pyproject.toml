[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovwidgets-common"
dynamic = ["version"]
description = "OvWidgets shared library: WidgetServices protocol, types, adapters, settings, selection, undo, scheduler, error reporter, icon caches, managed window, dialogs, snap, mock adapters (numpy in [testing] extra)"
requires-python = ">=3.10"
dependencies = [
    "ovui>=0.1.0",
    "ovui-data-adapters-common>=0.1.0",
]

[project.optional-dependencies]
# numpy is required only by ovwidgets.common.testing.mock_renderer (runtime)
# and ovwidgets.common.adapters (TYPE_CHECKING). Widget packages that don't
# use the mocks at runtime do not need numpy installed.
testing = ["numpy"]

[tool.setuptools.packages.find]
namespaces = true
include = ["ovwidgets.common*"]
where = ["../.."]

[tool.setuptools.package-data]
# Step 8/13 transferred icon ownership from ``ovwidgets-app`` to
# ``ovwidgets-common``. ``importlib.resources.files("ovwidgets.common")``
# resolves to these globs both in the editable in-tree layout and in a
# built wheel, so chevron / action / asset / status icons reach widget
# consumers (stage_delegate, layer_delegate, group_widget,
# file_browser_delegate, navigation_model) regardless of how the
# distribution was installed.
"ovwidgets.common" = [
    "icons/*.png",
    "resources/icons/*.svg",
    "resources/icons/*.png",
]
"ovwidgets.common.style" = ["icons/*.svg", "icons/*.png"]
