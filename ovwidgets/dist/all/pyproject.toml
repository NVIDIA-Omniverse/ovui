[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovwidgets-all"
dynamic = ["version"]
description = "OvWidgets meta-package: installs all components"
requires-python = ">=3.10"
dependencies = [
    "ovwidgets-common>=0.1.0",
    "ovwidgets-app>=0.1.0",
    "ovwidgets-stage>=0.1.0",
    "ovwidgets-layers>=0.1.0",
    "ovwidgets-content>=0.1.0",
    "ovwidgets-property>=0.1.0",
    "ovwidgets-viewport>=0.1.0",
    "ovui-data-adapters-common>=0.1.0",
    "ovui-data-adapters-openusd>=0.1.0",
]

[tool.setuptools.packages.find]
namespaces = true
include = []   # meta-package: no source files of its own
where = ["../.."]
