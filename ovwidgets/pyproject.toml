[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["."]

[[tool.mypy.overrides]]
module = ["omni.*", "pxr.*", "ovrtx.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E402: module-level imports not at top — intentional lazy/deferred import pattern
# E702: multiple statements on one line (semicolons) — pre-existing style
# E731: lambda assigned to variable — pre-existing style
# F401: imported but unused — accepted for re-export and conditional imports
# F841: local variable assigned but never used — pre-existing
ignore = ["E501", "E402", "E702", "E731", "F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "performance: Layers window performance benchmarks (LAYERS-PLAN Step 61)",
]
