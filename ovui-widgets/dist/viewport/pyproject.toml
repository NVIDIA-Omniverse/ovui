[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovui-widgets-viewport"
license = {text = "Apache-2.0"}
# Dependencies are in setup.py: first-party packages are pinned to VERSION.md.
dynamic = ["version", "dependencies"]
description = "ovui-widgets Viewport"
readme = {content-type = "text/markdown", text = """
# ovui-widgets-viewport

Viewport package for ovui-widgets. It combines rendered frames, camera controls,
HUD state, scene overlays, picking, selection outline feedback, and transform
manipulators into the viewport surface used by USD Viewer.

The viewport receives renderer, stage, transform, selection, snapping, and undo
objects from the application, so rendering and scene data can be swapped behind
the same visible interaction model.
"""}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[tool.setuptools.packages.find]
namespaces = true
include = ["ovui_widgets.viewport*"]
where = ["../.."]
