[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovui-widgets-layers"
license = {text = "Apache-2.0"}
# Dependencies are in setup.py: first-party packages are pinned to VERSION.md.
dynamic = ["version", "dependencies"]
description = "ovui-widgets Layers Panel"
readme = {content-type = "text/markdown", text = """
# ovui-widgets-layers

Layers and composition stack package for ovui-widgets. It shows layer order,
authoring target state, dirty/save state, mute and lock controls, missing-file
signals, optional prim-spec rows, and command-backed save, reload, insert,
remove, move, merge, flatten, mute, lock, and authoring-target operations.

The widget reads layer and composition data through adapter objects so it can
stay independent from the concrete scene backend.
"""}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
namespaces = true
include = ["ovui_widgets.layers*"]
where = ["../.."]
