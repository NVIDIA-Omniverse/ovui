[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovui-widgets-content"
license = {text = "Apache-2.0"}
# Dependencies are in setup.py: first-party packages are pinned to VERSION.md.
dynamic = ["version", "dependencies"]
description = "ovui-widgets Content Browser"
readme = {content-type = "text/markdown", text = """
# ovui-widgets-content

Content Browser package for ovui-widgets. It provides file-navigation UI,
bookmarks, recent files, local filesystem backend support, file picker dialogs,
import/export helpers, search, grid/list presentation, rename and delete flows,
and the explicit open-file handoff used by the USD Viewer application.

The browser is backend-oriented, so storage behavior can be replaced behind the
same visible widget surface.
"""}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[tool.setuptools.packages.find]
namespaces = true
include = ["ovui_widgets.content*"]
where = ["../.."]
