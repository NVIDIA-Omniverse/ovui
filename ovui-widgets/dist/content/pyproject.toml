[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovui-widgets-content"
dynamic = ["version"]
description = "ovui-widgets Content Browser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ovui-widgets-common>=0.1.0"]

[tool.setuptools.packages.find]
namespaces = true
include = ["ovui_widgets.content*"]
where = ["../.."]
