[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovui-widgets-all"
dynamic = ["version"]
description = "ovui-widgets meta-package: installs all components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ovui-widgets-common>=0.1.0",
    "ovui-widgets-app>=0.1.0",
    "ovui-widgets-stage>=0.1.0",
    "ovui-widgets-layers>=0.1.0",
    "ovui-widgets-content>=0.1.0",
    "ovui-widgets-property>=0.1.0",
    "ovui-widgets-viewport>=0.1.0",
    "ovui-data-adapters-common>=0.1.0",
    "ovui-data-adapters-openusd[standalone]>=0.2.0",
]

[tool.setuptools.packages.find]
namespaces = true
include = []   # meta-package: no source files of its own
where = ["../.."]
