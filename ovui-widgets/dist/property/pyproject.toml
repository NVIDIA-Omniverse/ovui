[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovui-widgets-property"
license = {text = "Apache-2.0"}
# Dependencies are in setup.py: first-party packages are pinned to VERSION.md.
dynamic = ["version", "dependencies"]
description = "ovui-widgets Property Inspector"
readme = {content-type = "text/markdown", text = """
# ovui-widgets-property

Property Inspector package for ovui-widgets. It follows app selection, asks a
property adapter for selected-object attributes and metadata, and builds
type-dispatched editors for scalar values, vectors, colors, tokens,
relationships, assets, matrices, arrays, and specialized property sections.

The inspector supports multi-selection ambiguity, reset behavior, edit
begin/set/end calls, and extension through the property scheme registry.
"""}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
namespaces = true
include = ["ovui_widgets.property*"]
where = ["../.."]
