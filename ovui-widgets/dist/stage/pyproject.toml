[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovui-widgets-stage"
license = {text = "Apache-2.0"}
# Dependencies are in setup.py: first-party packages are pinned to VERSION.md.
dynamic = ["version", "dependencies"]
description = "ovui-widgets Stage Browser"
readme = {content-type = "text/markdown", text = """
# ovui-widgets-stage

Stage Browser package for ovui-widgets. It turns scene hierarchy data into a
searchable, expandable tree with type labels, visibility controls, badges,
rename support, selection synchronization, lazy child loading, and drag/drop
reparent feedback.

The widget reads through `StageAdapter`, so a backend can provide OpenUSD,
mock, or project-specific hierarchy data while reusing the same browser UI.
"""}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
namespaces = true
include = ["ovui_widgets.stage*"]
where = ["../.."]
