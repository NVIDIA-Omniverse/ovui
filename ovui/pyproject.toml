[build-system]
requires = ["setuptools>=68.0", "wheel", "cmake>=3.22", "pybind11>=2.11", "conan>=2.14", "cyclonedx-python-lib>=5.0.0,<6"]
build-backend = "setuptools.build_meta"

[project]
name = "ovui"
# readme is dynamic: the PyPI long description is the repository root
# README.md (the product overview), not ovui/README.md (the in-repo
# framework guide). setup.py supplies it — see _read_long_description().
dynamic = ["version", "readme"]
description = "ovui — GPU-accelerated Python UI toolkit"
requires-python = ">=3.12"
license = {text = "NVIDIA Proprietary"}
authors = [
    {name = "NVIDIA Corporation"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Software Development :: User Interfaces",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/NVIDIA-Omniverse/ovui"

[project.scripts]
ovui-skill = "ovui_agent_skills:main"

[project.entry-points."ovui.skills"]
omniverse-ui-apis = "ovui_agent_skills:get_omniverse_ui_apis_skill"
omniverse-ui-inspector = "ovui_agent_skills:get_omniverse_ui_inspector_skill"

[project.optional-dependencies]
examples = [
    "numpy>=1.21",
    "cuda-python",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "requires_gl: test needs an OpenGL context (CUDA-GL interop, FBO) — auto-skipped under headless Vulkan",
    "requires_glfw: test needs the GLFW windowing platform (streaming pipeline) — auto-skipped under any OMNIUI_HEADLESS=1 mode (Vulkan or EGL surfaceless)",
    "requires_cuda: test needs a CUDA runtime (libcudart) loadable in-process — auto-skipped when libcudart.so is unavailable",
]

[tool.setuptools]
# Package discovery is handled by setup.py
py-modules = []
