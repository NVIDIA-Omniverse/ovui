# Per-marker progress tracker.
#
# Each entry describes one atomic feature the SUT must render indistinguishably
# from the oracle. Fields:
#   file:       corpus/ path to the MD that isolates the marker
#   category:   inline | block | composite | document
#   status:     red (not attempted) | yellow (close) | green (matched)
#   ssim_gate:  minimum SSIM required to flip status to "green" (tuned per
#               marker class; text-heavy atoms should demand higher than
#               image-heavy atoms)
#   notes:     human-readable observations, last diff highlights
#
# Status is set by diff/compare.py and manually promoted after review.

