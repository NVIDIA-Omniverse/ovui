#
# Wheel build — produces native binary wheels for ovui.
#
# The Linux wheels are built against the headless Vulkan + Lavapipe toolchain
# (the same recipe B1 uses) plus CUDA 12.8 development components. A CUDA
# driver stub keeps hosted-runner smoke tests driver-free; real CUDA use still
# requires a driver at runtime. The Windows
# wheel uses the GitHub-hosted Windows Server 2022 image, its preinstalled
# Visual Studio 2022 toolchain, Vulkan headers/loader installed with the
# image's preinstalled vcpkg, and CUDA 12.8 compiler/runtime components from
# NVIDIA's network installer. setup.py bundles the compiled native libraries
# into each wheel:
#
#   omni/ui/_ui*.so|*.pyd
#   omni/ui/libovui.so* or ovui.dll
#   omni/ui/libomniui_standalone.so* or omniui_standalone.dll
#   omni/ui/resources/{fonts,glyphs,twemoji-atlas.{png,json}}
#   omni/ui_scene/_scene*.so|*.pyd
#   omni/ui_scene/libovuiscene.so* or ovuiscene.dll
#
# RPATH is set to $ORIGIN on Linux by setup.py so the libraries find each other
# at runtime without LD_LIBRARY_PATH manipulation. Windows package imports add
# the package DLL directories at import time.
#
# Triggers:
#   * workflow_dispatch — build on demand; optionally attach to an existing release_tag
#   * release: [published] — build and attach all wheels to the published release
#
# Outputs:
#   * Workflow artifacts for Linux x64, Linux ARM64, manylinux x64,
#     manylinux aarch64, and Windows x64 wheels (each Linux job emits
#     both a plain linux_<arch> wheel and a retagged
#     manylinux_2_35_<arch> wheel into the same artifact)
#   * Release assets on published release events and manual release_tag runs

name: Build Wheel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag to attach wheels to"
        required: false
        type: string
        default: ""
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-wheel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheel-linux:
    name: Build wheel (${{ matrix.label }}, Vulkan + CUDA)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-22.04
            artifact: ovui-wheel-linux-x64
            linux_tag: linux_x86_64
            manylinux_tag: manylinux_2_35_x86_64
            cuda_repo_arch: x86_64
          - label: Linux ARM64
            runner: ubuntu-22.04-arm
            artifact: ovui-wheel-linux-arm64
            linux_tag: linux_aarch64
            manylinux_tag: manylinux_2_35_aarch64
            cuda_repo_arch: sbsa

    env:
      DEBIAN_FRONTEND: noninteractive
      CUDAToolkit_ROOT: /usr/local/cuda-12.8
      OMNIUI_CMAKE_ARGS: >-
        -DOMNIUI_USE_BUNDLED_GLFW=ON
        -DOMNIUI_USE_BUNDLED_FREETYPE=ON
        -DOMNIUI_REQUIRE_VULKAN=ON
        -DOMNIUI_REQUIRE_CUDA=ON

    defaults:
      run:
        working-directory: ovui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve checked-out commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "OVUI_BUILD_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "EXPECTED_COMMIT_SHA=$sha" >> "$GITHUB_ENV"

      - name: Install Vulkan, CUDA, and static dependency build prerequisites
        # Do not install libglfw3-dev, libfreetype-dev, or libfontconfig1-dev:
        # wheel builds force the pinned static FetchContent targets instead.
        # GLFW's source build still needs the Wayland and X11 headers below.
        run: |
          set -euo pipefail
          keyring="$RUNNER_TEMP/cuda-keyring_1.1-1_all.deb"
          curl -fsSL \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/${{ matrix.cuda_repo_arch }}/cuda-keyring_1.1-1_all.deb" \
            -o "$keyring"
          sudo dpkg -i "$keyring"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-8 \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libgl-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            cmake \
            ninja-build \
            pkg-config \
            python3-dev

          test -x "$CUDAToolkit_ROOT/bin/nvcc"
          test -f "$CUDAToolkit_ROOT/include/cuda_runtime.h"
          cuda_stub="$(find "$CUDAToolkit_ROOT" -path '*/stubs/libcuda.so' -print -quit)"
          cuda_runtime="$(find "$CUDAToolkit_ROOT" -name 'libcudart.so.12' -print -quit)"
          test -n "$cuda_stub"
          test -n "$cuda_runtime"
          stub_dir="$RUNNER_TEMP/cuda-driver-stub"
          mkdir -p "$stub_dir"
          ln -s "$cuda_stub" "$stub_dir/libcuda.so.1"
          echo "LD_LIBRARY_PATH=$stub_dir:$(dirname "$cuda_runtime")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$CUDAToolkit_ROOT/bin/nvcc" --version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip toolchain
        run: |
          python -m pip install --upgrade pip wheel setuptools build

      - name: Build wheel
        run: |
          python -m pip wheel . --no-deps -w dist/ -v

      - name: Retag wheel for manylinux
        run: |
          shopt -s nullglob
          src_wheels=(dist/ovui-*-cp312-cp312-${{ matrix.linux_tag }}.whl)
          if [ "${#src_wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one ${{ matrix.linux_tag }} wheel in dist/, found ${#src_wheels[@]}"
            printf '  %s\n' "${src_wheels[@]}"
            exit 1
          fi
          python -m wheel tags --platform-tag ${{ matrix.manylinux_tag }} "${src_wheels[0]}"
          echo "dist/ after retag:"
          ls -la dist/

      - name: Show wheel contents
        run: |
          ls -la dist/
          for whl in dist/*.whl; do
            echo "=== $whl ==="
            python -m zipfile -l "$whl"
          done

      - name: Smoke test — verify filename, install wheel, import omni.ui
        env:
          OMNIUI_HEADLESS: "1"
          OMNIUI_BACKEND: "vulkan"
          OMNIUI_LAVAPIPE: "1"
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "no wheels found in dist/"; exit 1
          fi
          for whl in "${wheels[@]}"; do
            echo "checking wheel filename: $whl"
            basename_whl="$(basename "$whl")"
            if [[ "$basename_whl" != ovui-* ]]; then
              echo "  FAIL: unexpected wheel filename format: $basename_whl"; exit 1
            fi
            echo "  filename OK: $basename_whl"
          done
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install "${wheels[0]}"
          /tmp/wheel-venv/bin/python - <<'PY'
          import os
          import omni.ui
          import omni.ui_scene
          version = getattr(omni.ui, "__version__", None)
          commit = getattr(omni.ui, "__commit__", None)
          expected = os.environ["EXPECTED_COMMIT_SHA"]
          print(f"omni.ui ok — version={version!r} commit={commit!r}")
          print("omni.ui_scene ok")
          assert version, "omni.ui.__version__ is empty"
          print(f"  version={version!r} — OK")
          assert commit == expected, (
              f"omni.ui.__commit__ {commit!r} does not match GITHUB_SHA {expected!r}"
          )
          PY
          /tmp/wheel-venv/bin/python ../.github/scripts/validate_packaged_skills.py \
            --expected omniverse-ui-apis omniverse-ui-inspector

      - name: Build pure-Python project wheels
        if: matrix.linux_tag == 'linux_x86_64'
        run: |
          set -euo pipefail
          projects=(
            ovui-data-adapters/dist/common
            ovui-data-adapters/dist/services
            ovui-data-adapters/dist/openusd
            ovui-data-adapters/dist/ovstage
            ovui-widgets/dist/common
            ovui-widgets/dist/content
            ovui-widgets/dist/stage
            ovui-widgets/dist/layers
            ovui-widgets/dist/property
            ovui-widgets/dist/viewport
            ovui-widgets/dist/app
            ovui-widgets/dist/all
          )
          for project in "${projects[@]}"; do
            python -m pip wheel --no-deps -w dist/ "../$project"
          done

      - name: Validate skills in release wheels
        if: matrix.linux_tag == 'linux_x86_64'
        run: |
          set -euo pipefail
          shopt -s nullglob
          app=(dist/ovui_widgets_app-*-py3-none-any.whl)
          if [ "${#app[@]}" -ne 1 ]; then
            echo "Expected one ovui-widgets-app wheel"
            exit 1
          fi
          /tmp/wheel-venv/bin/pip install --no-deps "${app[0]}"
          /tmp/wheel-venv/bin/python ../.github/scripts/validate_packaged_skills.py

      - name: Upload wheel as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ovui/dist/*.whl
          if-no-files-found: error

  build-wheel-windows:
    name: Build wheel (Windows x64, Vulkan + CUDA)
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64
      OMNIUI_BUILD_JOBS: "2"
      OMNIUI_CMAKE_ARGS: >-
        -DOMNIUI_USE_BUNDLED_GLFW=ON
        -DOMNIUI_USE_BUNDLED_FREETYPE=ON
        -DOMNIUI_REQUIRE_VULKAN=ON
        -DOMNIUI_REQUIRE_CUDA=ON

    defaults:
      run:
        working-directory: ovui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve checked-out commit
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          "OVUI_BUILD_COMMIT_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPECTED_COMMIT_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install CUDA 12.8 compiler and runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "cuda_12.8.2_windows_network.exe"
          Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/12.8.2/network_installers/cuda_12.8.2_windows_network.exe" -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "-s", "-n", "cudart_12.8", "nvcc_12.8") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "CUDA installer failed with exit code $($process.ExitCode)"
          }
          $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8"
          foreach ($required in @(
            "bin\nvcc.exe",
            "bin\cudart64_12.dll",
            "include\cuda_runtime.h",
            "include\crt\host_config.h",
            "lib\x64\cuda.lib",
            "lib\x64\cudart.lib")) {
            $path = Join-Path $cudaRoot $required
            if (-not (Test-Path $path)) { throw "CUDA component is missing: $path" }
          }
          "CUDA_PATH=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDAToolkit_ROOT=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $cudaRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $cudaRoot "bin\x64") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $cudaRoot "bin\nvcc.exe") --version

      - name: Install Vulkan headers and loader
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set on this runner"
          }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) {
            throw "vcpkg.exe was not found at $vcpkg"
          }
          & $vcpkg install vulkan-headers:x64-windows vulkan-loader:x64-windows
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          $includeDir = Join-Path $installed "include"
          $header = Join-Path $includeDir "vulkan\vulkan.h"
          if (-not (Test-Path $header)) {
            throw "Expected Vulkan header was not created: $header"
          }
          $releaseLibrary = Join-Path $installed "lib\vulkan-1.lib"
          $debugLibrary = Join-Path $installed "debug\lib\vulkan-1.lib"
          if (Test-Path $releaseLibrary) {
            $library = Get-Item $releaseLibrary
          } elseif (Test-Path $debugLibrary) {
            $library = Get-Item $debugLibrary
          } else {
            throw "Expected Vulkan import library was not found under $installed"
          }
          $releaseLoaderDll = Join-Path $installed "bin\vulkan-1.dll"
          $debugLoaderDll = Join-Path $installed "debug\bin\vulkan-1.dll"
          if (Test-Path $releaseLoaderDll) {
            $loaderDll = Get-Item $releaseLoaderDll
          } elseif (Test-Path $debugLoaderDll) {
            $loaderDll = Get-Item $debugLoaderDll
          } else {
            throw "Expected Vulkan loader DLL was not found under $installed"
          }
          "Vulkan_INCLUDE_DIR=$includeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Vulkan_LIBRARY=$($library.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Vulkan_DLL_DIR=$($loaderDll.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $loaderDll.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Upgrade pip toolchain
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools build cmake pybind11

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip wheel . --no-deps -w dist/ -v

      - name: Show wheel contents
        shell: pwsh
        run: |
          Get-ChildItem dist
          foreach ($wheel in Get-ChildItem dist/*.whl) {
            Write-Host "=== $($wheel.FullName) ==="
            python -m zipfile -l $wheel.FullName
          }

      - name: Smoke test — verify filename, install wheel, import omni.ui
        shell: pwsh
        run: |
          $wheels = Get-ChildItem dist/*.whl
          if ($wheels.Count -eq 0) { throw "no wheels found in dist/" }
          foreach ($w in $wheels) {
            Write-Host "checking wheel filename: $($w.Name)"
            if ($w.Name -notmatch '^ovui-') {
              throw "unexpected wheel filename format: $($w.Name)"
            }
            Write-Host "  filename OK"
          }
          python -m venv "$env:RUNNER_TEMP\wheel-venv"
          $python = "$env:RUNNER_TEMP\wheel-venv\Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install $wheels[0].FullName
          $checkScript = @'
          import os
          p = os.environ.get("Vulkan_DLL_DIR")
          if p and hasattr(os, "add_dll_directory"):
              os.add_dll_directory(p)
          import omni.ui
          import omni.ui_scene
          version = getattr(omni.ui, "__version__", None)
          commit = getattr(omni.ui, "__commit__", None)
          expected = os.environ["EXPECTED_COMMIT_SHA"]
          print(f"omni.ui ok - version={version!r} commit={commit!r}")
          print("omni.ui_scene ok")
          assert version, "omni.ui.__version__ is empty"
          print(f"  version={version!r} - OK")
          assert commit == expected, f"omni.ui.__commit__ {commit!r} does not match GITHUB_SHA {expected!r}"
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP "wheel_smoke.py"
          Set-Content -Path $scriptPath -Value $checkScript -Encoding utf8
          & $python $scriptPath
          & $python ..\.github\scripts\validate_packaged_skills.py `
            --expected omniverse-ui-apis omniverse-ui-inspector

      - name: Upload wheel as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ovui-wheel-windows-x64
          path: ovui/dist/*.whl
          if-no-files-found: error

  attach-release-wheels:
    name: Attach wheels to GitHub release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-22.04
    needs:
      - build-wheel-linux
      - build-wheel-windows
    permissions:
      contents: write

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ovui-wheel-*
          path: wheelhouse
          merge-multiple: true

      - name: Show release wheel set
        run: |
          ls -la wheelhouse/

      - name: Validate release wheel set
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 17 = 5 native ovui wheels (Linux x64/ARM64, manylinux x64/aarch64,
          # Windows x64) + the 12 universal pure-Python distributions below.
          wheels=(wheelhouse/*.whl)
          if [ "${#wheels[@]}" -ne 17 ]; then
            echo "Expected exactly 17 project wheels, found ${#wheels[@]}"
            printf '  %s\n' "${wheels[@]}"
            exit 1
          fi

          require_one() {
            local pattern="$1"
            local label="$2"
            local matches=(wheelhouse/$pattern)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one ${label} wheel matching ${pattern}, found ${#matches[@]}"
              printf '  %s\n' "${matches[@]}"
              exit 1
            fi
            echo "${label}: $(basename "${matches[0]}")"
          }

          require_one "ovui-*-cp312-cp312-linux_x86_64.whl" "Linux x64"
          require_one "ovui-*-cp312-cp312-linux_aarch64.whl" "Linux ARM64"
          require_one "ovui-*-cp312-cp312-manylinux_2_35_x86_64.whl" "manylinux x64"
          require_one "ovui-*-cp312-cp312-manylinux_2_35_aarch64.whl" "manylinux aarch64"
          require_one "ovui-*-cp312-cp312-win_amd64.whl" "Windows x64"

          universal_distributions=(
            ovui_data_adapters_common
            ovui_data_adapters_services
            ovui_data_adapters_openusd
            ovui_data_adapters_ovstage
            ovui_widgets_common
            ovui_widgets_content
            ovui_widgets_stage
            ovui_widgets_layers
            ovui_widgets_property
            ovui_widgets_viewport
            ovui_widgets_app
            ovui_widgets_all
          )
          for distribution in "${universal_distributions[@]}"; do
            require_one "$distribution-*-py3-none-any.whl" "$distribution universal"
          done

      - name: Attach wheels to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" wheelhouse/*.whl --clobber
