#
# B3 â€” pytest under headless EGL surfaceless (no GPU, no display server).
# Runs the Python test suite against the EGL-backed standalone build using
# EGL_MESA_platform_surfaceless on stock ubuntu-22.04. Unlike B1/B2,
# requires_gl tests CAN run on this leg because EGL provides a real GL
# context (without a window).
#
# Golden image comparison is enforced in strict mode. Baselines under
# tests/golden/egl/ must be generated on the same hosted EGL surfaceless
# runner class this workflow uses; regenerate them with
# .github/workflows/generate-goldens.yml (workflow_dispatch,
# backend: egl) after intentional renderer or layout changes.
#
# Refs: ovui issue #36 (Phase 6, B3 leg).

name: B3 EGL-surfaceless (pytest)

on:
  push:
    branches:
      - main
      - 'test/**'
  pull_request:
    branches:
      - main

concurrency:
  group: test-b3-egl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-egl-surfaceless:
    name: pytest (B3 EGL-surfaceless, Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]

    env:
      OMNIUI_HEADLESS: "1"
      OMNIUI_HEADLESS_GL: "1"
      OMNIUI_EGL_FORCE_SURFACELESS: "1"
      MESA_GL_VERSION_OVERRIDE: "3.3"
      OMNI_UI_GOLDEN_STRICT: "1"
      DEBIAN_FRONTEND: noninteractive

    defaults:
      run:
        working-directory: ovui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install EGL + Mesa + build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            mesa-utils \
            libgl1-mesa-dri \
            xvfb \
            libglfw3-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            cmake \
            ninja-build \
            pkg-config \
            python3-dev

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Upgrade pip toolchain
        run: |
          python -m pip install --upgrade pip wheel setuptools

      - name: Build and install ovui (headless EGL)
        env:
          OMNIUI_CMAKE_ARGS: "-DOMNIUI_HEADLESS_GL=ON"
        run: |
          pip install -e . -v

      - name: Install test requirements
        run: |
          pip install -r requirements-test.txt

      - name: Run pytest (EGL-surfaceless headless)
        shell: bash
        run: |
          set -o pipefail
          ulimit -c 0
          mkdir -p coverage-reports/b3
          rm -f .coverage
          # test_standalone_resize_present.py checks the swapchain of the Vulkan
          # backend after a window size change. This EGL build has no Vulkan
          # backend, so that test cannot run here: it fails (a build option is
          # not missing hardware, so it does not skip). The Linux app-wheelhouse
          # jobs run it against wheels built with Vulkan enabled.
          {
            pytest \
              tests/test_markdown_provider_coverage.py \
              tests/test_python_utility_coverage.py \
              --cov \
              --cov-config=.coveragerc \
              --cov-report= \
              -q \
              --color=yes
            pytest tests/ \
              --ignore=tests/test_markdown_provider_coverage.py \
              --ignore=tests/test_python_utility_coverage.py \
              --ignore=tests/test_standalone_resize_present.py \
              --forked \
              -m "not requires_cuda" \
              --cov \
              --cov-append \
              --cov-config=.coveragerc \
              --cov-report=term-missing:skip-covered \
              --cov-report=xml:coverage-reports/b3/coverage.xml \
              --cov-report=html:coverage-reports/b3/html \
              -q \
              --color=yes
          } 2>&1 | tee /tmp/pytest-b3.log

      - name: Add coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "## B3 Python coverage"
            echo
            if [ -f .coverage ]; then
              echo '```text'
              python -m coverage report --show-missing --skip-covered || true
              echo '```'
              echo
              echo "Download the \`coverage-b3\` artifact for HTML and XML reports."
            else
              echo "No coverage data file was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-b3-log-py${{ matrix.python }}
          path: /tmp/pytest-b3.log
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-b3-py${{ matrix.python }}
          path: ovui/coverage-reports/b3/
          if-no-files-found: warn

      - name: Upload captured diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-b3-captured-py${{ matrix.python }}
          path: ovui/tests/captured/
          if-no-files-found: ignore
